name: ci

on:
  push:
  pull_request:

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            spec/package-lock.json
            spec/client/package-lock.json
      - name: Install backend deps
        run: npm ci
        working-directory: backend
      - name: Install frontend deps
        run: npm ci
        working-directory: frontend
      - name: Install spec deps
        run: npm ci
        working-directory: spec
      - name: ESLint
        run: make lint
      - name: Prettier check
        run: make format-check

  test:
    name: test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            spec/package-lock.json
            spec/client/package-lock.json
      - name: Install backend deps
        run: npm ci
        working-directory: backend
      - name: Install spec deps
        run: npm ci
        working-directory: spec
      - name: Build SDK from TypeSpec
        run: make openapi
      - name: Install frontend deps
        run: npm ci
        working-directory: frontend
      - name: Run tests
        run: make test

  build:
    name: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            spec/package-lock.json
            spec/client/package-lock.json
      - name: Install backend deps
        run: npm ci
        working-directory: backend
      - name: Install spec deps
        run: npm ci
        working-directory: spec
      - name: Build SDK from TypeSpec
        run: make openapi
      - name: Install frontend deps
        run: npm ci
        working-directory: frontend
      - name: Build packages
        run: make build
      - name: Contract artifacts up to date
        run: make openapi-check

  docker:
    name: docker
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build dev images
        run: docker compose build
      - name: Build production image
        run: docker build -t booking-app .
      - name: Smoke-test production image
        run: |
          docker run -d --name booking-app -e PORT=8080 -p 8080:8080 booking-app
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/health; then
              docker stop booking-app
              exit 0
            fi
            sleep 1
          done
          docker logs booking-app
          docker stop booking-app
          exit 1
