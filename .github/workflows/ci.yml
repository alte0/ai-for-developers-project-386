name: ci

on:
  push:
  pull_request:

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            spec/package-lock.json
            spec/client/package-lock.json
      - name: Install backend deps
        run: npm ci
        working-directory: backend
      - name: Install frontend deps
        run: npm ci
        working-directory: frontend
      - name: Install spec deps
        run: npm ci
        working-directory: spec
      - name: ESLint
        run: make lint
      - name: Prettier check
        run: make format-check

  test:
    name: test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            spec/package-lock.json
            spec/client/package-lock.json
      - name: Install backend deps
        run: npm ci
        working-directory: backend
      - name: Install spec deps
        run: npm ci
        working-directory: spec
      - name: Build SDK from TypeSpec
        run: make openapi
      - name: Install frontend deps
        run: npm ci
        working-directory: frontend
      - name: Run tests
        run: make test

  build:
    name: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            spec/package-lock.json
            spec/client/package-lock.json
      - name: Install backend deps
        run: npm ci
        working-directory: backend
      - name: Install spec deps
        run: npm ci
        working-directory: spec
      - name: Build SDK from TypeSpec
        run: make openapi
      - name: Install frontend deps
        run: npm ci
        working-directory: frontend
      - name: Build packages
        run: make build
      - name: Contract artifacts up to date
        run: make openapi-check

  docker:
    name: docker
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build images
        run: docker compose build
