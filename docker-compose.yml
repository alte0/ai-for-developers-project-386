# Dev-стек: два сервиса из единственного корневого Dockerfile.
# Production/проверка — один контейнер из стадии `runtime`: `make up-app`.
services:
  api:
    build:
      context: .
      target: dev-api
    ports:
      - '${PORT:-3000}:${PORT:-3000}'
    env_file:
      # Корневой .env не обязателен: без него PORT берётся из environment ниже.
      - path: ./.env
        required: false
    environment:
      PORT: ${PORT:-3000}
    volumes:
      - ./backend/src:/app/src
      # SQLite-база переживает пересоздание контейнера (путь из DATABASE_PATH, ./data/booking.db).
      - ./backend/data:/app/data
  web:
    build:
      context: .
      target: dev-web
    ports:
      - '5173:5173'
    environment:
      # Vite проксирует /api на api:${PORT}. Локально без Docker:
      # API_URL=http://localhost:3000 npm --prefix frontend run dev
      API_URL: http://api:${PORT:-3000}
    volumes:
      # Live reload: правки в frontend/ видны сразу (Vite HMR), без пересборки.
      - ./frontend:/app/frontend
      # Контейнерный node_modules (иначе bind-mount хостит хостовые модули, собранные под macOS).
      - /app/frontend/node_modules
    depends_on:
      - api
