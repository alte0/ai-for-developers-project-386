services:
  api:
    build:
      context: ./backend
      target: dev
    ports:
      - '3000:3000'
    env_file:
      - ./backend/.env.example
    volumes:
      - ./backend/src:/app/src
      # SQLite-база переживает пересоздание контейнера (путь из DATABASE_PATH, ./data/booking.db).
      - ./backend/data:/app/data
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: dev
    ports:
      - '5173:5173'
    volumes:
      # Live reload: правки в frontend/ видны сразу (Vite HMR), без пересборки.
      - ./frontend:/app/frontend
      # Контейнерный node_modules (иначе bind-mount хостит хостовые модули, собранные под macOS).
      - /app/frontend/node_modules
    depends_on:
      - api
